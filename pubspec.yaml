name: my_template
description: Feature-based clean architecture Flutter template.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_screenutil: ^5.9.0
  intl: ^0.20.2
  equatable: ^2.0.5
  flutter_native_splash: ^2.4.7
  connectivity_plus: ^6.1.4
  video_player: ^2.11.1
  # flutter_glass_morphism: ^1.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/data/
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
  #   - assets/svgs/
  #   - assets/fonts/s
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/cairo_regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/cairo_medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/cairo_semibold.ttf
          weight: 600
        - asset: assets/fonts/cairo/cairo_bold.ttf
          weight: 700

flutter_native_splash:
  color: "#FFFFFF"
  android_12:
    color: "#FFFFFF"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Thaheen logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Thaheen logo.jpg"
